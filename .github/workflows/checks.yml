name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app_backend/requirements.lock
      - run: python -m pip install -r app_backend/requirements.lock
      - run: PYTHONPATH=app_backend python -m pytest app_backend/tests -q
      - run: python contract/export_schemas.py --check
      - run: node --check frontend/app.js
      - run: node --check simulation/web/app.js
      - run: python -m compileall -q simulation
