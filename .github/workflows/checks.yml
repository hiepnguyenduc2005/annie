name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robot/app_backend/requirements.lock
      - run: python -m pip install -r robot/robot_backend/requirements-brain.txt
      - run: python -m pytest robot/app_backend/tests robot/robot_backend/tests robot/simulation/tests/test_bridge.py robot/simulation/tests/test_speech.py -q
      - run: python robot/contract/export_schemas.py --check
      - run: node --check robot/frontend/app.js
      - run: node --check robot/simulation/web/app.js
      - run: python -m compileall -q robot
